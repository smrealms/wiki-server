networks:
    frontend:
        name: frontend
    backend:
        name: backend

services:
    wiki:
        image: requarks/wiki:3.4.0
        restart: unless-stopped
        container_name: smr-wiki
        networks:
            - frontend
            - backend
        environment:
            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASS: ${ADMIN_PASS}
            DB_HOST: wiki-db
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASS: ${DB_PASS}
        volumes:
            - ./wiki-data.pem:/github.pem:ro
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"
            - "traefik.http.services.wiki.loadbalancer.server.port=3000"
            - "traefik.http.routers.wiki.rule=Host(`wiki.smrealms.de`)"
        depends_on:
            wiki-db:
                condition: service_healthy

    wiki-db:
        image: postgres:18
        restart: unless-stopped
        networks:
            - backend
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
        volumes:
            - wiki3-db:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    wiki3-db:
